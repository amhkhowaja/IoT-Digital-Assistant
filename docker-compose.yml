services:
  # Rasa NLU + Dialogue Server
  rasa:
    build:
      context: .
      dockerfile: Dockerfile.rasa
    ports:
      - "5005:5005"
    environment:
      - RASA_MODEL_PATH=/app/models
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./endpoints.docker.yml:/app/endpoints.yml:ro
    depends_on:
      mongodb:
        condition: service_healthy
      action-server:
        condition: service_started
    restart: unless-stopped

  # Custom Action Server
  action-server:
    build:
      context: .
      dockerfile: Dockerfile.actions
    ports:
      - "5055:5055"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=${MONGODB_DB:-IOTA}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (Chatbot Widget + Portal)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=${MONGODB_DB:-IOTA}
      - STATIC_DIR=/app/public
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # MongoDB
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # === AIRFLOW (NLU Training Pipeline) ===
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    entrypoint: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["pipeline"]

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - PIPELINE_DATA_DIR=/opt/airflow/data
      - PIPELINE_OUTPUT_DIR=/opt/airflow/output
      - PYTHONPATH=/opt/airflow
    command: webserver
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./Chatbot/NLU/data:/opt/airflow/data
      - ./data:/opt/airflow/rasa_data
      - ./pipeline_output:/opt/airflow/output
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: ["pipeline"]

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PIPELINE_DATA_DIR=/opt/airflow/data
      - PIPELINE_OUTPUT_DIR=/opt/airflow/output
      - PYTHONPATH=/opt/airflow
      - SKIP_CUSTOM_VALIDATION=${SKIP_CUSTOM_VALIDATION:-false}
      - RASA_CONFIDENCE_THRESHOLD=${RASA_CONFIDENCE_THRESHOLD:-0.85}
      - ENABLE_AUTO_TRAIN=${ENABLE_AUTO_TRAIN:-false}
      - RASA_SERVER_URL=http://rasa:5005
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./Chatbot/NLU/data:/opt/airflow/data
      - ./data:/opt/airflow/rasa_data
      - ./pipeline_output:/opt/airflow/output
      - ./models:/opt/airflow/models
      - .:/opt/airflow/project
      - /var/run/docker.sock:/var/run/docker.sock
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles: ["pipeline"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: ["pipeline"]

volumes:
  mongo_data:
  postgres_data:
  airflow_logs:
