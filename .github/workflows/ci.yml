name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 1st of every month at 02:00 UTC
    - cron: '0 2 1 * *'
  workflow_dispatch: # Manual trigger

jobs:
  validate:
    name: Validate Training Data
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Rasa
        run: pip install rasa==3.4.4

      - name: Validate NLU data
        run: rasa data validate
        continue-on-error: true

  train:
    name: Train & Test Model
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Rasa
        run: pip install rasa==3.4.4

      - name: Train model
        run: rasa train --fixed-model-name latest

      - name: Run tests
        run: rasa test --no-errors
        continue-on-error: true

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: rasa-model-${{ github.run_number }}
          path: models/latest.tar.gz
          retention-days: 90

  push-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: train
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push action server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.actions
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/iot-action-server:latest

      - name: Build & push airflow pipeline
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.airflow
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/iot-airflow-pipeline:latest
